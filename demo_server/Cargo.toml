[package]
name = "demo_server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "demo_server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
