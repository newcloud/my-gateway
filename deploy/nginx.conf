# my_gateway 阶段 1 本地运行配置
# 安装位置：nginx/conf/nginx.conf（由 scripts/build-nginx.sh 拷贝）
# 前缀目录：nginx/（logs 相对于前缀）

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

# 由 scripts/build-module.sh 编译并拷贝到这里
load_module modules/libmy_gateway.so;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;

    # 临时目录放在本地前缀内，避免写 /var/lib/nginx
    client_body_temp_path logs/tmp/client_body;
    proxy_temp_path       logs/tmp/proxy;
    fastcgi_temp_path     logs/tmp/fastcgi;
    uwsgi_temp_path       logs/tmp/uwsgi;
    scgi_temp_path        logs/tmp/scgi;

    default_type application/json;

    # ------------------------------------------------------------------
    # 网关定义（http 级，可以有多个）
    #   顺序要求：gateway_name → 契约来源 → 可选 gateway_ttl，
    #   且必须写在引用它的 server/location 之前（nginx -t 会校验名字）。
    #
    #   契约来源二选一，不能同时写：
    #     gateway_info_url  <name> <url>   —— 插件从后端拉；后端能改规则
    #     gateway_info_file <name> <path>  —— 读本地文件；只有能写文件的人能改规则
    #
    #   ⚠ 安全原因：URL 模式下后端一旦被入侵，攻击者改自己的 /info 返回值
    #     就能在 TTL 内给自己加路由、把 unmatched 改成 forward。要求"规则不
    #     受被保护对象影响"时请用 gateway_info_file，并保证文件对后端进程
    #     只读（root 拥有 + 0640），发布用 mv 原子替换。
    #     详见 docs/PROTOCOL.md 第 1.1 / 1.2 节。
    # ------------------------------------------------------------------
    gateway_name     myrustwebdemo1;
    gateway_info_url myrustwebdemo1 http://127.0.0.1:9000/info;
    gateway_ttl      myrustwebdemo1 3;

    # 第二个网关：指向**不同**的契约地址（内容只有部分路由重叠），
    # 用来验证两个网关各自独立刷新、判定互不影响
    gateway_name     myrustwebdemo2;
    gateway_info_url myrustwebdemo2 http://127.0.0.1:9000/info_v2;
    gateway_ttl      myrustwebdemo2 5;

    # 文件模式示例（本仓库默认不启用，避免与 demo 的 URL 对照重复）：
    #   gateway_name      filegw;
    #   gateway_info_file filegw conf/contracts/demo.json;   # 相对 nginx prefix
    #   gateway_ttl       filegw 2;                          # 只 stat，开销很低

    upstream demo_backend {
        server 127.0.0.1:9000;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        # 网关接管：插件在 access 阶段先跑，被拦的请求不会打到 demo_server
        location / {
            enable_gateway_by myrustwebdemo1;
            proxy_pass http://demo_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 一个 location 可以绑定多个网关（与语义：两个都放行才放行）
        # /info 两份契约都声明 → 200（响应体是 v1，因为 /info 由后端返回 v1 内容）
        location = /info {
            enable_gateway_by myrustwebdemo1;
            enable_gateway_by myrustwebdemo2;
            proxy_pass http://demo_backend;
        }

        # ------------------------------------------------------------------
        # 两份契约的差异对照（v1 = /info，v2 = /info_v2）
        # ------------------------------------------------------------------

        # 只在 v2 声明 → 绑 v2 放行；顺带证明 demo2 读的确实是 /info_v2
        location = /info_v2 {
            enable_gateway_by myrustwebdemo2;
            proxy_pass http://demo_backend;
        }

        location = /api/metrics {
            enable_gateway_by myrustwebdemo2;
            proxy_pass http://demo_backend;
        }

        # v2 的动态路由 /api/reports/{year}
        location = /api/reports/2026 {
            enable_gateway_by myrustwebdemo2;
            proxy_pass http://demo_backend;
        }

        # 只在 v1 声明：后端有这个接口，但 v2 契约没有 → 网关应 404 且不落到后端
        location = /api/user/99 {
            enable_gateway_by myrustwebdemo2;
            proxy_pass http://demo_backend;
        }

        # 只在 v2 声明，但这里同时绑了 v1：v1 先判 → 404 + X-Gateway-Name: myrustwebdemo1
        location = /api/audit {
            enable_gateway_by myrustwebdemo1;
            enable_gateway_by myrustwebdemo2;
            proxy_pass http://demo_backend;
        }

        # 对照：不写 enable_gateway_by = 不做判定，请求直接透传
        location /passthrough/ {
            proxy_pass http://demo_backend/;
            proxy_set_header Host $host;
        }
    }
}
