# httpbin 演示实例：一个 server，全部路径代理到 https://httpbin.org
#
# 独立于主配置使用（复制到临时 prefix，见 tests/httpbin.sh）：
#   nginx -p <prefix> -c conf/nginx.conf
#
# 契约来自本地文件（gateway_info_file），不依赖后端返回规则：
#   启动 / nginx -t 时读取一次，改契约后需要 reload。
worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

load_module modules/libmy_gateway.so;

events {
    worker_connections 64;
}

http {
    access_log off;
    default_type application/json;

    client_max_body_size 64k;

    # 本地演示实例：打开诊断头，测试脚本靠它断言 reason/field。
    # 生产配置不要这一行（默认 off）。
    gateway_diagnostics on;

    gateway_name      httpbin_gw;
    gateway_info_file httpbin_gw conf/contract.json;

    server {
        listen 127.0.0.1:18080;

        location / {
            enable_gateway_by httpbin_gw;

            proxy_pass https://httpbin.org;
            proxy_ssl_server_name on;
            proxy_set_header Host httpbin.org;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
